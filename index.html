<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Giới thiệu bản thân</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
  font-family:Arial;

  background:
  linear-gradient(rgba(0,0,0,0.5),
  rgba(0,0,0,0.5)),
  url('https://images.openai.com/static-rsc-4/1_cuQisGKmVIHLecIuvZy4H8FwyZYxFipeI0YcyeY-jdDCGMJF9R6FybqaqG_DDy4biiQyE2SHkOgb7gJjR3hyLbkhpS6fULvlaitouMS75yRDmyjXdQVdMp-zpUwGxIrOfoXkLw-aDNTNbB1_vXMyrXBwOD05cPlkRdVpxdGobvfWpYzAXwzdnZSFR84CTh?purpose=fullsize');

  background-size:110%;
  background-position:center;
  background-attachment:fixed;

  color:white;

  animation:bgMove 15s ease infinite alternate;
}

    .container{
      width:90%;
      max-width:1100px;
      margin:auto;
      padding:40px 0;
    }

    .hero{
      text-align:center;
      padding:60px 20px;
    }

    .avatar{
      width:180px;
      height:180px;
      border-radius:50%;
      border:5px solid #38bdf8;
      object-fit:cover;
      box-shadow:0 0 30px #38bdf8;
    }

    h1{
      font-size:55px;
      margin-top:20px;
      color:#38bdf8;
    }

    .job{
      font-size:24px;
      margin-top:10px;
      color:#cbd5e1;
    }

    .desc{
      margin-top:20px;
      font-size:18px;
      line-height:1.7;
      color:#e2e8f0;
    }

    .btn{
      display:inline-block;
      margin-top:30px;
      padding:14px 35px;
      background:#38bdf8;
      color:white;
      text-decoration:none;
      border-radius:12px;
      transition:0.3s;
      font-size:18px;
    }

    .btn:hover{
      background:#0284c7;
      transform:scale(1.05);
    }

    .section-title{
      text-align:center;
      font-size:40px;
      margin:60px 0 30px;
      color:#38bdf8;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .gallery img{
      width:100%;
      height:250px;
      object-fit:cover;
      border-radius:20px;
      transition:0.4s;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    .gallery img:hover{
      transform:scale(1.05);
    }

    .info{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:40px;
    }

    .card{
      background:#1e293b;
      padding:25px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 0 15px rgba(0,0,0,0.3);
    }

    .card h3{
      color:#38bdf8;
      margin-bottom:10px;
      font-size:28px;
    }

    footer{
      text-align:center;
      margin-top:70px;
      padding:30px;
      color:#94a3b8;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="hero">

      <img

      <div class="desc">
    これは私の自己紹介ウェブサイトです。
私はデザインが好きで、昭和鋼機を愛しています。
      </div>

       もし機械エンジニアになりたい、または交流したい方は、ぜひ私にご連絡ください。
                                Zalo: 0867839314
      </a>

    </div>

    <h2 class="section-title">
      プロフィール写真
    </h2>

    <div class="gallery">

      <img src="cont2-5.png">

      <img src="cont2-4.png">

      <img src="cont2-3.png">

      <img src="cont2-1.png">

    </div>

    <h2 class="section-title">

    </h2>

<div class="card">
  <img src="https://images.openai.com/static-rsc-4/Lfug0BQvmRFPLdpBAJCbpaTb9RaeyxoVNDnMZqI0mfvUbVSuGVWhfVvctEk-_iqjupBhFOy-XbMIHX0-V2sc-3kYovtxDIt3aATdbfQxWbCD5Y9kfNqqXy9j7z1pGR_Ky-h6eL3OoNuZPRPOt5ACcjgIfI9QJpYDHr2yeZVt_xJIZB7CrAUNAQeZpsSLiL7R?purpose=fullsize" class="skill-img">
  <h3>Word Excel PowerPoint</h3>

    </div>

    <footer>

</body>
</html>
